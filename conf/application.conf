# conf/application.conf
#
# Only the bits we actually need to touch for this project are kept here -
# everything else just uses Play's defaults.

play.filters.enabled += "play.filters.csrf.CSRFFilter"

# --- Mastodon configuration ---------------------------------------------
# We NEVER hardcode the instance/token. Both are read from environment
# variables so nothing secret ever ends up in the Git repo (see assignment
# section 3). mastodon.social is just a sane default for local dev so the
# app doesn't blow up immediately if you forget to export the env var.
mastodon {
  instance = "mastodon.social"
  instance = ${?MASTODON_INSTANCE}

  # No default for the token on purpose - if it's missing, MastodonClient
  # will fail fast with a clear error instead of silently calling the API
  # unauthenticated.
  accessToken = ""
  accessToken = ${?MASTODON_ACCESS_TOKEN}

  # Hard cap enforced on our side too, not just passed to the API - belt and
  # suspenders, see assignment 4.1 ("must not retrieve an unlimited number").
  maxPostsPerRequest = 40

  # How long we keep a (hashtag -> page) response in cache before we're
  # willing to hit the API again for the exact same query (section 5.3,
  # "do not query the API multiple times with the same hashtag").
  cacheTtlSeconds = 60
}

# WSClient timeouts - Mastodon instances can be slow/overloaded, we don't
# want a hung request to block a worker thread forever.
play.ws.timeout.connection = 5 seconds
play.ws.timeout.request = 10 seconds
